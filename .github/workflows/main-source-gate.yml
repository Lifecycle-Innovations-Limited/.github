name: Main source gate

# Required org-wide via ruleset on HealifyCore repos (custom property
# HealifyCore=healifycore): PRs into main may only come from the dev branch of
# the same repository.
#
# Runner: self-hosted AWS fleet (runner group aws-ephemeral-private, label
# [self-hosted, Linux, aws]). Was `ubuntu-latest`, which is GitHub-hosted and
# blocked by the org's Actions spending limit: the job never started and
# reported `failure` (annotation: "The job was not started because recent
# account payments have failed or your spending limit needs to be increased").
# That made this required check fail intermittently and blocked every dev -> main
# promotion on 2026-10-15/16/17 while it could not actually run. All nine
# HealifyCore repos are in that runner group, so the self-hosted fleet is
# available to every repo this gate applies to. 2026-10-17.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  main-source-gate:
    name: PR to main must come from dev
    runs-on: [self-hosted, Linux, aws]
    steps:
      - name: Check source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::PRs to main must come from this repository's dev branch, not a fork ($HEAD_REPO)."
            exit 1
          fi
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::PRs to main must come from dev. This PR is from '$HEAD_REF'. Merge it into dev first; dev syncs to main."
            exit 1
          fi
          echo "OK: PR into main comes from dev."
